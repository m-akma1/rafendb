name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older run: saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # This name is the status check the main ruleset requires. Rename both together.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compile, test, and check formatting
      # Apply is skipped so unformatted code fails here
      - name: Build
        run: ./mvnw -B -ntp -Dspotless.apply.skip=true verify
